services:
  db:
    image: mysql:8.0
    container_name: sias-db
    restart: always
    environment:
      MYSQL_DATABASE: sias_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: password123
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-ppassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sias-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sias-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/sias_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - sias-network

volumes:
  mysql_data:

networks:
  sias-network: